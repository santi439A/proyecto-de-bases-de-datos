services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-proyecto-final
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: admin123
      APP_USER: proyecto_final
      APP_USER_PASSWORD: proyecto123
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: always

volumes:
  oracle-data:
